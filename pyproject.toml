[project]
name = "customer-support-agent"
version = "0.1.0"
description = "Anthropic tool-calling agent over the Month 2 RAG corpus."
readme = "README.md"
authors = [
    { name = "b-paquette", email = "b.paquette@celonis.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "langfuse>=4.7.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 12

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
